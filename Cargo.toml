[package]
name = "rust-practice"
version = "0.3.0"
description = "A programming application in Rust"
repository = "https://github.com/neerajsinghaldev/rust-practice"
homepage = "https://neerajsinghaldev.github.io/rust-practice/"
documentation = "https://neerajsinghaldev.github.io/rust-practice/docs/doxygen-html/doc/rust_practice/index.html"
readme = "README.md"
license = "MIT"
authors = ["Neeraj Singhal <neerajsinghal93@gmail.com>"]
edition = "2024"
rust-version = "1.85"
keywords = ["practice", "tutorial", "learning"]
categories = ["command-line-utilities"]
publish = false # practice project - prevents accidental `cargo publish`

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.9"

[dev-dependencies]
# Add test-only crates here, e.g. `assert_cmd = "2"` or `proptest = "1"`

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
